[project]
name = "chaos-experiment-kit"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

# Development tools (PEP 735). Install with: python -m pip install --group dev  (pip 25.1+)
[dependency-groups]
dev = ["mypy==2.4.0", "ruff==0.17.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C90", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
