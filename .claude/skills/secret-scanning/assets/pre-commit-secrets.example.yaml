# Secret-scanning hooks for pre-commit (https://pre-commit.com). Merge into .pre-commit-config.yaml,
# then run: pre-commit install --hook-type pre-commit --hook-type pre-push
# Hook definitions checked against each project's .pre-commit-hooks.yaml on 2026-10-29.
repos:
  # gitleaks v8.30.1 (MIT): scans the staged changes, redacted.
  # Hook entry: gitleaks git --pre-commit --redact --staged --verbose
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # TruffleHog v3.99.7 (AGPL-3.0, used as a tool): finds secrets and checks with the provider whether
  # they are live. Verification sends each candidate credential to its provider's API, so enable this
  # hook only if the owner accepts that. pre-commit builds it with Go (language: golang) on first use.
  # The upstream hook runs:
  # trufflehog git file://. --since-commit HEAD --results=verified --fail --trust-local-git-config
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.99.7
    hooks:
      - id: trufflehog
        stages: ["pre-push"]
