# Copy to .github/workflows/secret-scan.yml. Two scanners with pinned, checksum-verified binaries:
# gitleaks over the full history (no network calls about findings), and TruffleHog over the commits of
# the push or pull request with live verification. Versions, checksums and action SHAs checked 2026-10-29.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'

  trufflehog:
    name: TruffleHog (changed commits, verified)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRUFFLEHOG_VERSION: 3.99.7
      # From trufflehog_3.99.7_checksums.txt in the release.
      TRUFFLEHOG_SHA256: bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install TruffleHog (pinned version, verified checksum)
        run: |
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/$archive"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trufflehog
      # Exit code 183 means results were found. Verification calls each provider's API with the
      # candidate credential; add --no-verification where the owner does not allow that.
      - name: Scan the changed commits
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            since=(--since-commit "$BASE")
          else
            since=()
          fi
          "$RUNNER_TEMP/trufflehog" git "file://$GITHUB_WORKSPACE" "${since[@]}" --branch HEAD \
            --results=verified,unknown --fail --no-update
